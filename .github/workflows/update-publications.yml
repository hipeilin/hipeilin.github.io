name: Update Google Scholar Data

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at 00:00 UTC
  workflow_dispatch:     # Allows you to trigger it manually from the Actions tab

permissions:
  contents: write        # Needed to commit the updated JSON file

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install scholarly

      - name: Run scraper
        env:
          SCHOLAR_ID: "YOUR_SCHOLAR_ID"
        run: python fetch_publications.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add publications.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update Google Scholar metrics"
          git push
